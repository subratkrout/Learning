version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-apppassword}@db:5432/${POSTGRES_DB:-appdb}
      PORT: 8000
    depends_on:
      - db
    ports:
      - "8000:8000"
    networks:
      - app-network

  # ui:
  #   build: ./ui
  #   environment:
  #     - NEXT_PUBLIC_API_BASE_URL=http://api:8000
  #   depends_on:
  #     - api
  #   ports:
  #     - "8080:3000"
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge
